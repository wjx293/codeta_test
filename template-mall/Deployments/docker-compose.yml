version: "3.9"

# ============================================================
# 模板商城微服务系统 - Docker Compose 完整编排
# 宪法 §Fixed Project Layout & Ports 固定端口：
#   3000 / 3001 / 8080 / 8081 / 8083 / 9001
# ============================================================

services:
  # ----------------------------------------------------------
  # 基础设施
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: template-mall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-template_order_db}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - template-mall-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: template-mall-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - template-mall-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: template-mall-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: template-mall
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "8090:8090"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - template-mall-net

  # ----------------------------------------------------------
  # 应用服务
  # ----------------------------------------------------------
  template-order-server:
    build:
      context: ../TemplateOrderServer
      dockerfile: Dockerfile
    image: template-mall/template-order-server:latest
    container_name: template-mall-order-server
    restart: unless-stopped
    environment:
      GRPC_PORT: 9001
      MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:-root123456}@tcp(mysql:3306)/${MYSQL_DATABASE:-template_order_db}?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
      KAFKA_BROKERS: kafka:19092
      KAFKA_TOPIC: template-pay-events
      KAFKA_GROUP_ID: template-order-consumer-group
      PAY_WEB_SERVER_URL: http://pay-web-server:8083
      JWT_SECRET: ${JWT_SECRET:-template-mall-secret-key}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_REGION: ${OSS_REGION:-}
    ports:
      - "9001:9001"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9001"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - template-mall-net

  pay-web-server:
    build:
      context: ../PayWebServer
      dockerfile: Dockerfile
    image: template-mall/pay-web-server:latest
    container_name: template-mall-pay-server
    restart: unless-stopped
    environment:
      HTTP_PORT: 8083
      MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:-root123456}@tcp(mysql:3306)/${MYSQL_DATABASE:-template_order_db}?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
      KAFKA_BROKERS: kafka:19092
      KAFKA_TOPIC: template-pay-events
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8083/health | grep -q PayWebServer"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - template-mall-net

  template-web-server:
    build:
      context: ..
      dockerfile: TemplateWebServer/Dockerfile
    image: template-mall/template-web-server:latest
    container_name: template-mall-web-server
    restart: unless-stopped
    environment:
      HTTP_PORT: 8080
      GRPC_TARGET: template-order-server:9001
      JWT_SECRET: ${JWT_SECRET:-template-mall-secret-key}
    ports:
      - "8080:8080"
    depends_on:
      template-order-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health | grep -q TemplateWebServer"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - template-mall-net

  template-admin-web-server:
    build:
      context: ..
      dockerfile: TemplateAdminWebServer/Dockerfile
    image: template-mall/template-admin-web-server:latest
    container_name: template-mall-admin-web-server
    restart: unless-stopped
    environment:
      HTTP_PORT: 8081
      GRPC_TARGET: template-order-server:9001
      AUTH_PROVIDER: ${AUTH_PROVIDER:-wps}
      WPS_CLIENT_ID: ${WPS_CLIENT_ID:-AK20230207WTGKYW}
      WPS_CLIENT_SECRET: ${WPS_CLIENT_SECRET:-}
      WPS_REDIRECT_URI: ${WPS_REDIRECT_URI:-http://localhost:3001/api/auth/callback}
      WPS_SCOPE: ${WPS_SCOPE:-kso.user_base.read}
      WPS_KSO_SIGN_ENABLED: ${WPS_KSO_SIGN_ENABLED:-false}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-10001,10002}
      FRONTEND_HOME_URL: ${FRONTEND_HOME_URL:-http://localhost:3001/}
      MOCK_ADMIN_USER_ID: ${MOCK_ADMIN_USER_ID:-10001}
      MOCK_ADMIN_NAME: ${MOCK_ADMIN_NAME:-MockAdmin}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_REGION: ${OSS_REGION:-}
      STS_ROLE_ARN: ${STS_ROLE_ARN:-}
      STS_SESSION_NAME: ${STS_SESSION_NAME:-template-mall-admin}
    ports:
      - "8081:8081"
    depends_on:
      template-order-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/health | grep -q TemplateAdminWebServer"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - template-mall-net

  template-frontend:
    build:
      context: ../TemplateFrontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    image: template-mall/template-frontend:latest
    container_name: template-mall-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      template-web-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - template-mall-net

  template-admin-frontend:
    build:
      context: ../TemplateAdminFrontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_AUTH_MODE: wps
    image: template-mall/template-admin-frontend:latest
    container_name: template-mall-admin-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      template-admin-web-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3001/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - template-mall-net

networks:
  template-mall-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  kafka_data:
    driver: local
